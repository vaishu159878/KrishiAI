services:
  backend:
    build: ./backend
    restart: always
    environment:
      - DATABASE_URL
      - AI_API_KEY
      - GEMINI_MODEL
      - JWT_SECRET_KEY
      - ENVIRONMENT=production
    expose:
      - "8000"

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "5000:80"
    depends_on:
      - backend
