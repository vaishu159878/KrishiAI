
services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://krishiai:krishiai_dev_password@db:5432/krishiai
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8081:80"
    depends_on:
      - backend

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: krishiai
      POSTGRES_USER: krishiai
      POSTGRES_PASSWORD: krishiai_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U krishiai -d krishiai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
